[project]
name = "aitea-backend"
version = "0.1.0"
description = "Configuration-driven tea export preparation workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1",
  "pypdf[fonts]>=6.1,<7",
  "python-dotenv>=1.1,<2",
  "pypdfium2>=5.14,<6",
  "pillow>=12.3,<13",
  "numpy>=2,<3",
  "xlrd>=2.0.2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
