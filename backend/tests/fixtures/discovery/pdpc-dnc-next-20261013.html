<!doctype html><title>PDPC official guidance fixture</title><h1>Advisory Guidelines</h1><main><div class="rte"></div></main><script>self.__next_f.push([1, "27:T6ae,\u003cp>These Advisory Guidelines provide an explanation of how the DNC Provisions, which are set out in Part 9 of the PDPA, may apply in different scenarios and allows organisations and individuals to better understand the requirements. They should be read in conjunction with the \u003ca href=\"/organisations/regulations-decisions/regulatory-guidance/advisory-guidelines-on-key-concepts-in-the-personal-data-protection-act\">Advisory Guidelines on Key Concepts in the Personal Data Protection Act\u003c/a> and \u003ca href=\"/organisations/regulations-decisions/regulatory-guidance/advisory-guidelines-on-the-personal-data-protection-act-for-selected-topics\">Advisory Guidelines on the Personal Data Protection Act for Selected Topics\u003c/a>.\u003c/p>\n\u003cp>The full document is available \u003ca href=\"/assets/8440dd4d-973b-4b1b-bbb9-2c42c5dec81b\">here\u003c/a>.\u003c/p>\n\u003ch2 style=\"color: #000000;\">Chapters Listing\u003c/h2>\n\u003cul>\n\u003cli>Introduction (Part I)\u003c/li>\n\u003cli>Definition of a Specified Message (Part II)\u003c/li>\n\u003cli>Duty to Check the DNC Register and the Requirement to Obtain Clear and Unambiguous Consent in Evidential Form (Part III)\u003c/li>\n\u003cli>Requirement to Include Identification and Contact Information in Specified Messages (Part IV)\u003c/li>\n\u003cli>Definition of Sender (Part V)\u003c/li>\n\u003cli>Dictionary Attacks and Address-Harvesting Software (Part VI)\u003c/li>\n\u003cli>Other Clarifications (Part VII)\u003c/li>\n\u003c/ul>\n\u003ch4>Revisions to Advisory Guidelines (updated 1 February 2021)\u003c/h4>\n\u003cp>The Advisory Guidelines have been updated to provide clarity on the amendments to the PDPA which came into force on 1 February 2021. These include prohibitions relating to the use of dictionary attacks and address-harvesting software, and requirements on third-party DNC checkers.\u003c/p>"])</script>
