<!doctype html><title>PDPC official guidance fixture</title><h1>Advisory Guidelines</h1><main><div class="rte"></div></main><script>self.__next_f.push([1, "27:T86d,\u003cp>The Advisory Guidelines for Key Concepts elaborate on and provide illustrations for the key obligations in the PDPA and interpretation of key terms in the PDPA. These assist in organisations and individuals&rsquo; general understanding of the PDPA.\u003c/p>\n\u003cp>The \u003ca title=\"Advisory guidelines on key concepts in the Personal Data Protection Act\" href=\"/assets/34058be5-ae13-4c40-89e6-1c945d19f65c\">full document is available&nbsp;here\u003c/a>.&nbsp;The annexes are available here: \u003ca href=\"/assets/a9d1f217-d3cb-4056-bbd0-41a29ab63605\">Annex A\u003c/a>, \u003ca href=\"/assets/889e03cc-5e3d-4caa-be15-ee3342672008\">Annex B\u003c/a>&nbsp;and \u003ca href=\"/assets/1582fb83-088e-4899-b298-0be0d85bbfa1\">Annex C\u003c/a>.&nbsp;\u003c/p>\n\u003ch2>Chapters Listing\u003c/h2>\n\u003cul>\n\u003cli>Chapters 1 - 2: Introduction and Overview\u003c/li>\n\u003cli>Chapters 3 - 9: Important Terms Used in the PDPA\u003c/li>\n\u003cli>Chapter 10: Overview of the Data Protection Provisions\u003c/li>\n\u003cli>Chapter 11: Applicability to Inbound Data Transfers\u003c/li>\n\u003cli>Chapter 12: The Consent Obligation\u003c/li>\n\u003cli>Chapter 13: The Purpose Limitation Obligation\u003c/li>\n\u003cli>Chapter 14: The Notification Obligation\u003c/li>\n\u003cli>Chapter 15: The Access and Correction Obligations\u003c/li>\n\u003cli>Chapter 16: The Accuracy Obligation\u003c/li>\n\u003cli>Chapter 17: The Protection Obligation\u003c/li>\n\u003cli>Chapter 18: The Retention Limitation Obligation\u003c/li>\n\u003cli>Chapter 19: The Transfer Limitation Obligation\u003c/li>\n\u003cli>Chapter 20: The Data Breach Notification Obligation\u003c/li>\n\u003cli>Chapter 21: The Accountability Obligation\u003c/li>\n\u003cli>Chapters 22 - 23: Offences affecting personal data and anonymised information\u003c/li>\n\u003cli>Chapters 24 - 26: Other Rights, Obligations and Uses\u003c/li>\n\u003cli>Annex A: Framework for the Collection, Use and Disclosure of Personal Data\u003c/li>\n\u003cli>Annex B: Assessment Checklist for Deemed Consent by Notification\u003c/li>\n\u003cli>Annex C: Assessment Checklist for Legitimate Interests Exception\u003c/li>\n\u003c/ul>\n\u003ch4>Revisions to Advisory Guidelines\u003c/h4>\n\u003cp>As of 29 April 2026, the section on \"Conditions for transfer of personal data overseas\" has been updated to include references to the Global Cross-Border Privacy Rules System, and the Global Privacy Recognition for Processors System.\u003c/p>"])</script>
