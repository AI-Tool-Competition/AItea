<!doctype html><title>PDPC official guidance fixture</title><h1>Advisory Guidelines</h1><main><div class="rte"></div></main><script>self.__next_f.push([1, "27:T7f9,\u003cp>The Advisory Guidelines for Selected Topics elaborates on how the PDPA applies to particular issues and domains. These assist in organisations and individuals&rsquo; understanding of the PDPA in the context of the topics selected.\u003c/p>\n\u003cp>The full document is available&nbsp;\u003ca href=\"/assets/d1fbaa47-1471-4208-bfad-9f4bf33453ad\">here\u003c/a>.\u003c/p>\n\u003ch2>Chapters Listing\u003c/h2>\n\u003cul>\n\u003cli>Chapter 1: Introduction and Overview\u003c/li>\n\u003cli>Chapter 2: Analytics and Research\u003c/li>\n\u003cli>Chapter 3: Anonymisation\u003c/li>\n\u003cli>Chapter 4: Photography, Video and Audio Recordings\u003c/li>\n\u003cli>Chapter 5: Drones\u003c/li>\n\u003cli>Chapter 6: Employment\u003c/li>\n\u003cli>Chapter 7: Online Activities\u003c/li>\n\u003cli>Chapter 8: Data Activities Relating to Minors\u003c/li>\n\u003cli>Chapter 9: Cloud Services\u003c/li>\n\u003c/ul>\n\u003ch4 style=\"color: #000000; margin-right: 0cm; margin-left: 0cm;\">Revisions to Advisory Guidelines:\u003c/h4>\n\u003cdiv class=\"accordion\">\n\u003cdiv class=\"accordion-group\">\u003cstrong>As of 23 May 2024\u003c/strong>\n\u003cdiv id=\"accordion-1\" class=\"accordion-content\">\n\u003cdiv class=\"rte\">\n\u003cp>The chapter on &ldquo;Data Activities Relating to Minors&rdquo; has been updated to clarify how the data protection provisions in the PDPA apply to minors' (i.e., individuals below 21 years of age) personal data.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"accordion\">\n\u003cdiv class=\"accordion-group\">\u003cstrong>As of 31 March 2022\u003c/strong>\n\u003cdiv id=\"accordion-1\" class=\"accordion-content\">\n\u003cdiv class=\"rte\">\n\u003cp>The chapter on Anonymisation has been updated to provide clarity to companies on the requirements for anonymising data.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"accordion\">\n\u003cdiv class=\"accordion-group\">\u003cstrong>As of 17 May 2022\u003c/strong>\n\u003cdiv id=\"accordion-1\" class=\"accordion-content\">\n\u003cdiv class=\"rte\">\n\u003cp>The section on &ldquo;Closed-Circuit Television Cameras (&ldquo;CCTVs&rdquo;)&rdquo; under chapter on &ldquo;Photography, Video and Audio Recordings&rdquo; has been updated to provide more clarity to companies on the requirements for handling personal data captured through CCTVs.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>"])</script>
