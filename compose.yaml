name: aitea
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      TEA_ENV: ${TEA_ENV:-development}
      TEA_DATA_DIR: /data
      TEA_COOKIE_SECURE: ${TEA_COOKIE_SECURE:-false}
      TEA_ALLOWED_ORIGINS: ${TEA_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      TEA_PARSER: ${TEA_PARSER:-basic}
    volumes:
      - tea_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        TEA_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${TEA_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  tea_data:
